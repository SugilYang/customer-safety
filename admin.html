<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고객사 현장 안전 길잡이 — 이수 현황</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--g:#00806F;--g3:#E3F3F0;--ink:#1a1f1c;--mute:#5f6b65;--line:#e3e8e5;--bg:#f4f6f5;--red:#B3261E;--amber:#B26A00;--amber-bg:#FFF4E0;--red-bg:#FCE9E7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px;word-break:keep-all}
button{font:inherit;cursor:pointer;border:0}
.top{background:linear-gradient(90deg,#00806F,#0B6B5E);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px}
.lg{display:inline-flex;align-items:center;background:#fff;border-radius:8px;padding:5px 9px;height:34px}
.lg img{height:22px;display:block}
.wm{font-weight:900;font-size:20px;background:#fff;color:var(--g);padding:0 8px;border-radius:6px;line-height:26px}
.top img{height:24px}
.top .t{font-weight:700}.top .t small{display:block;font-weight:400;font-size:11px;opacity:.85}
.wrap{max-width:980px;margin:0 auto;padding:18px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:12px}
.login{max-width:380px;margin:60px auto}
input{font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;width:100%;outline:none}
input:focus{border-color:var(--g)}
.btn{background:var(--g);color:#fff;border-radius:10px;padding:11px 16px;font-weight:700}
.btn.ghost{background:var(--g3);color:var(--g)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.stat{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat b{font-size:24px;display:block;line-height:1.2}.stat span{font-size:12px;color:var(--mute)}
.stat.red b{color:var(--red)}.stat.amber b{color:var(--amber)}.stat.g b{color:var(--g)}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.bar input{flex:1;min-width:180px}
.chips button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;margin-right:4px}
.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13.5px;vertical-align:middle}
th{color:var(--mute);font-weight:500;font-size:12px;white-space:nowrap}
tr.exp td{color:#9a9a9a}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--g3);color:var(--g);white-space:nowrap}
.pill.red{background:var(--red-bg);color:var(--red)}.pill.amber{background:var(--amber-bg);color:var(--amber)}
.mute{color:var(--mute);font-size:12px}
.err{color:var(--red);font-size:13px;margin-top:8px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)} .hide-m{display:none}}
</style>
</head>
<body>
<div class="top"><img src="img/ets_logo_white.png" alt="ETS" onerror="this.outerHTML='<span class=wm>ETS</span>'"><div class="t">고객사 현장 안전 길잡이 — 교육 이수 현황<small>생산관리 · 현장 출입 전 확인용</small></div></div>
<div class="wrap" id="app"></div>
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxLZvGIZvX2daaUTSKVGgOfpLOZV1JOiJeJFmazq_Diaxx2OW8VIACi_w9No29K3f_bKg/exec'; // index.html 과 동일한 GAS 웹앱 URL
let ROWS=[], PW=sessionStorage.getItem('lges_pw')||'', F={q:'',st:'전체'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>String(d||'').slice(0,16);
function loginView(msg){ $('#app').innerHTML=`<div class="card login"><h3 style="margin:0 0 10px">관리자 확인</h3><p class="mute" style="margin:0 0 12px">비밀번호를 입력하세요.</p><input id="pw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')login()"><button class="btn" style="width:100%;margin-top:10px" onclick="login()">확인</button>${msg?`<div class="err">${esc(msg)}</div>`:''}</div>`; $('#pw').focus(); }
async function login(){ PW=$('#pw').value; await load(); }
async function load(){
  if(!GAS_URL.startsWith('http')) return loginView('GAS URL이 설정되지 않았습니다.');
  $('#app').innerHTML='<p class="mute">불러오는 중…</p>';
  try{ const r=await fetch(GAS_URL+'?action=list&pw='+encodeURIComponent(PW),{cache:'no-store'}); const j=await r.json();
    if(!j.ok){ sessionStorage.removeItem('lges_pw'); return loginView(j.error||'오류'); }
    sessionStorage.setItem('lges_pw',PW); ROWS=j.rows; render();
  }catch(e){ loginView('연결 실패: '+e.message); }
}
function render(){
  // 같은 사람(이름+연락처 뒤4) 최신 1건만 '현재 상태'로, 이력은 토글
  const key=r=>r['이름']+'|'+String(r['연락처']).replace(/\D/g,'').slice(-4);
  const latest={}; ROWS.forEach(r=>{ const k=key(r); if(!latest[k]||new Date(r['이수일시'])>new Date(latest[k]['이수일시'])) latest[k]=r; });
  let L=Object.values(latest);
  const cnt={유효:L.filter(r=>r.status==='유효').length, 만료임박:L.filter(r=>r.status==='만료임박').length, 만료:L.filter(r=>r.status==='만료').length};
  if(F.st!=='전체') L=L.filter(r=>r.status===F.st);
  const q=F.q.trim().toLowerCase(); if(q) L=L.filter(r=>[r['이름'],r['업체명'],r['연락처'],r['이메일']].join(' ').toLowerCase().includes(q));
  L.sort((a,b)=>new Date(b['이수일시'])-new Date(a['이수일시']));
  $('#app').innerHTML=`
  <div class="stats"><div class="stat"><b>${Object.keys(latest).length}</b><span>교육 이수자(명)</span></div><div class="stat g"><b>${cnt.유효}</b><span>유효</span></div><div class="stat amber"><b>${cnt.만료임박}</b><span>30일 내 만료</span></div><div class="stat red"><b>${cnt.만료}</b><span>만료 — 재교육 필요</span></div></div>
  <div class="card">
    <div class="bar"><input id="q" placeholder="이름·업체·연락처 검색" value="${esc(F.q)}" oninput="F.q=this.value;render();document.getElementById('q').focus();document.getElementById('q').setSelectionRange(99,99)">
      <span class="chips">${['전체','유효','만료임박','만료'].map(s=>`<button class="${F.st===s?'on':''}" onclick="F.st='${s}';render()">${s}</button>`).join('')}</span>
      <button class="btn ghost" onclick="load()">새로고침</button><button class="btn ghost" onclick="csv()">CSV</button></div>
    <div style="overflow-x:auto"><table><thead><tr><th>상태</th><th>이름</th><th>업체명</th><th>연락처</th><th class="hide-m">이메일</th><th>이수일</th><th>만료일</th><th>남은일</th></tr></thead><tbody>
    ${L.length?L.map(r=>`<tr class="${r.status==='만료'?'exp':''}"><td><span class="pill ${r.status==='만료'?'red':r.status==='만료임박'?'amber':''}">${r.status}</span></td><td><b>${esc(r['이름'])}</b></td><td>${esc(r['업체명'])}</td><td>${esc(r['연락처'])}</td><td class="hide-m mute">${esc(r['이메일'])}</td><td>${esc(fmt(r['이수일시']))}</td><td>${esc(String(r['만료일']).slice(0,10))}</td><td style="text-align:right;font-weight:700;color:${r.daysLeft<0?'var(--red)':r.daysLeft<=30?'var(--amber)':'var(--ink)'}">${r.daysLeft<0?'만료 '+(-r.daysLeft)+'일 경과':r.daysLeft+'일'}</td></tr>`).join(''):'<tr><td colspan="8" class="mute" style="text-align:center;padding:30px">해당 인원이 없습니다</td></tr>'}
    </tbody></table></div>
    <p class="mute" style="margin:10px 0 0">동일 인원(이름+연락처 뒤 4자리)은 가장 최근 이수 기록 기준으로 표시됩니다. 전체 이력 ${ROWS.length}건 · 유효기간 ${esc(String((ROWS[0]&&ROWS.validMonths)||6))}개월 · 만료 30·7·1일 전 본인 이메일로 자동 안내</p>
  </div>`;
}
function csv(){ const h=['상태','이름','업체명','연락처','이메일','이수일시','만료일']; const rows=ROWS.map(r=>h.map(k=>k==='상태'?r.status:r[k])); const t='﻿'+[h,...rows].map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'})); a.download='LGES_안전교육_이수현황.csv'; a.click(); }
PW?load():loginView();
</script>
</body>
</html>
