<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LGES 현장 안전 — ETS</title>
<meta name="theme-color" content="#1B5E3C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--g:#1B5E3C;--g2:#2E7D55;--g3:#E6F2EC;--ink:#1a1f1c;--mute:#5f6b65;--line:#e3e8e5;--bg:#f4f6f5;--card:#fff;--red:#B3261E;--amber:#B26A00;--amber-bg:#FFF4E0;--red-bg:#FCE9E7;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.55;word-break:keep-all}
button{font:inherit;cursor:pointer;border:0}
input,select{font:inherit}
a{color:var(--g)}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
/* header */
.top{position:sticky;top:0;z-index:10;background:var(--g);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.logo{display:flex;align-items:center;gap:8px}
.logo img{height:26px;display:block}
.wm{font-weight:900;letter-spacing:.5px;font-size:20px;background:#fff;color:var(--g);padding:0 8px;border-radius:6px;line-height:26px}
.top .t{font-weight:700;font-size:15px;line-height:1.2}
.top .t small{display:block;font-weight:400;font-size:11px;opacity:.85}
.top .back{margin-left:auto;background:rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
main{flex:1;padding:16px 16px 90px}
/* tabs */
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.nav .w{max-width:560px;margin:0 auto;display:flex;width:100%}
.nav button{flex:1;background:none;padding:10px 0 8px;color:var(--mute);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--g);font-weight:700}
/* cards */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .ic{width:26px;height:26px;border-radius:8px;background:var(--g3);color:var(--g);display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.hero{background:linear-gradient(135deg,var(--g),#124229);color:#fff;border-radius:18px;padding:20px 18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero h2{margin:0 0 4px;font-size:20px;line-height:1.3}
.hero p{margin:0 0 14px;opacity:.9;font-size:13.5px}
.hero .btn{width:100%;background:#fff;color:var(--g);font-weight:700;padding:14px;border-radius:12px;font-size:16px}
.hero .meta{display:flex;gap:14px;margin-top:10px;font-size:12px;opacity:.9}
.btn{background:var(--g);color:#fff;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px;width:100%}
.btn:disabled{background:#c3cdc8;color:#fff}
.btn.ghost{background:var(--g3);color:var(--g)}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;border-radius:9px}
.row{display:flex;gap:10px}
ol.list,ul.list{margin:0;padding-left:20px}
ol.list li,ul.list li{margin:5px 0}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--g3);color:var(--g);vertical-align:middle}
.pill.red{background:var(--red-bg);color:var(--red)}.pill.amber{background:var(--amber-bg);color:var(--amber)}.pill.gray{background:#eef1ef;color:var(--mute)}
.src{font-size:11.5px;color:var(--mute);margin-top:8px;display:flex;align-items:flex-start;gap:5px}
.src:before{content:"출처";flex:none;font-weight:700;color:var(--g);background:var(--g3);padding:0 6px;border-radius:4px;font-size:10.5px;line-height:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv b{color:var(--mute);font-weight:500}
.alert{background:var(--red-bg);border-left:4px solid var(--red);padding:10px 12px;border-radius:8px;font-size:13.5px;margin-bottom:12px}
/* quick grid */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.quick button{background:#fff;border-radius:12px;padding:12px 6px;box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:12.5px;font-weight:500;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px}
.quick button span{font-size:22px}
/* search */
.sbox{position:relative;margin-bottom:12px}
.sbox input{width:100%;padding:14px 44px 14px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:15px;outline:none}
.sbox input:focus{border-color:var(--g)}
.sbox svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;stroke:var(--mute);fill:none;stroke-width:2}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:6px;margin-bottom:6px}
.chips button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink)}
.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
.res .card{padding:14px}
.res h4{margin:0 0 6px;font-size:14.5px;line-height:1.4}
.res .tag{font-size:11px;color:var(--mute);margin-bottom:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.res p{margin:4px 0;font-size:14px}
.res .sub{font-size:13px;color:var(--mute)}
.res img{width:100%;border-radius:10px;margin:8px 0 2px;display:block}
.pt{font-size:18px;font-weight:900;color:var(--red);line-height:1}
.pt small{font-size:11px;font-weight:500;color:var(--mute)}
.ptrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.empty{text-align:center;color:var(--mute);padding:30px 10px;font-size:14px}
.sec{font-size:12.5px;font-weight:700;color:var(--mute);margin:14px 2px 8px;letter-spacing:.3px}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:500;font-size:12px}
td.n{text-align:right;white-space:nowrap;font-weight:700}
/* training */
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 12px}
.prog i{display:block;height:100%;background:var(--g);transition:width .3s}
.slide{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.slide .img{background:#eef1ef;display:flex;align-items:center;justify-content:center;min-height:140px;max-height:46vh;overflow:hidden}
.slide .img img{width:100%;height:100%;object-fit:contain;max-height:46vh;display:block}
.slide .body{padding:16px}
.slide .no{font-size:12px;color:var(--g);font-weight:700;letter-spacing:.5px}
.slide h2{margin:2px 0 10px;font-size:19px;line-height:1.3}
.slide ul{margin:0;padding:0;list-style:none}
.slide li{position:relative;padding-left:16px;margin:6px 0;font-size:14.5px}
.slide li:before{content:"";position:absolute;left:0;top:10px;width:7px;height:7px;border-radius:50%;background:var(--g)}
.slide li.arrow{padding-left:0;font-weight:700;color:var(--red)}
.slide li.arrow:before{display:none}
.slide li.do:before{background:#2E7D55}.slide li.dont:before{background:var(--red)}
.ctr{display:flex;align-items:center;gap:12px;margin-top:14px}
.ctr .btn{flex:1}
.ring{position:relative;width:52px;height:52px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--g);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px}
.art{width:100%;padding:14px;background:linear-gradient(160deg,var(--g3),#fff)}
.g8{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.g8 div{background:#fff;border-radius:10px;padding:8px 4px 6px;text-align:center;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.g8 b{position:absolute;left:5px;top:4px;font-size:10px;color:var(--g)}
.g8 .e,.g4 .e{font-size:26px;display:block;line-height:1.2}
.g8 small{display:block;font-size:10.5px;line-height:1.3;color:var(--ink);margin-top:3px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.g4 div{background:#fff;border-radius:10px;padding:10px 4px 8px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.g4 b{display:block;font-size:14px;color:var(--g);margin-top:2px}
.g4 small{display:block;font-size:10.5px;line-height:1.3;color:var(--mute);margin-top:2px}
.flow{display:flex;align-items:center;justify-content:center;gap:4px}
.flow span{background:#fff;border:1.5px solid var(--g);color:var(--g);border-radius:8px;padding:5px 7px;font-weight:700;font-size:12px;text-align:center;line-height:1.25}
.flow i{color:var(--g);font-style:normal;font-size:13px}
.stop{margin-top:10px;background:var(--red-bg);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--ink)}
.stop b{color:var(--red);display:block;margin-bottom:2px}
.cap{font-size:11px;color:var(--mute);text-align:center;margin-top:8px}
.ops .card{border-left:4px solid var(--g)}
.kwc{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px}
.kwc span{font-size:11px;background:#f1f4f2;color:var(--mute);border-radius:6px;padding:2px 7px}
.ob{margin:8px 0 0;padding:0;list-style:none}
.ob li{position:relative;padding-left:14px;margin:5px 0;font-size:13.5px;line-height:1.5}
.ob li:before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:var(--g)}
.ob li.h{padding-left:0;font-weight:700;color:var(--g);margin-top:8px}
.ob li.h:before{display:none}
.more{color:var(--g);font-size:13px;font-weight:700;background:none;padding:6px 0}
.viewer{position:fixed;inset:0;background:#111;z-index:100;display:flex;flex-direction:column}
.viewer .vh{color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:14px;background:#000;padding-top:max(10px,env(safe-area-inset-top))}
.viewer .vh b{flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer .vh button{background:rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:6px 12px}
.viewer .vb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
.viewer .vb img{display:block;width:100%;min-width:100%;margin-bottom:6px}
.viewer .tip{color:#aaa;font-size:12px;text-align:center;padding:6px}
.home-ops{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.home-ops button{background:#fff;border-radius:12px;padding:10px 12px;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:13px;line-height:1.35}
.home-ops button small{display:block;color:var(--g);font-weight:700;font-size:11px}
.noimg{padding:28px 20px;text-align:center;width:100%;background:linear-gradient(135deg,var(--g3),#fff)}
.noimg .big{font-size:44px;line-height:1}
.steps{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.steps span{background:#fff;border:1.5px solid var(--g);color:var(--g);border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px}
.steps i{align-self:center;color:var(--g);font-style:normal}
/* form */
.f label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.f input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none;font-size:15px}
.f input:focus{border-color:var(--g)}
.done{text-align:center;padding:10px 0}
.done .ok{width:72px;height:72px;border-radius:50%;background:var(--g3);color:var(--g);display:inline-flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.foot{text-align:center;font-size:11px;color:var(--mute);padding:14px 0 0}
.hid{display:none!important}
@media (min-width:600px){main{padding:20px 20px 100px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><img src="img/ets_logo.png" alt="ETS" onerror="this.outerHTML='<span class=wm>ETS</span>'"></div>
    <div class="t">LGES 현장 안전<small>고객사 투입 전 교육 · 안전수칙 검색</small></div>
    <button class="back hid" id="backBtn" onclick="go('home')">홈</button>
  </header>
  <main id="main"></main>
  <nav class="nav"><div class="w">
    <button data-v="home" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
    <button data-v="train" onclick="go('train')"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>교육</button>
    <button data-v="search" onclick="go('search')"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>검색</button>
    <button data-v="ops" onclick="go('ops')"><svg viewBox="0 0 24 24"><path d="M4 4h12l4 4v12H4z"/><path d="M8 12h8M8 16h8M8 8h4"/></svg>규정</button>
    <button data-v="penalty" onclick="go('penalty')"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 10h16M10 4v16"/></svg>벌점표</button>
  </div></nav>
</div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script>
/* ===== 설정 ===== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxLZvGIZvX2daaUTSKVGgOfpLOZV1JOiJeJFmazq_Diaxx2OW8VIACi_w9No29K3f_bKg/exec'; // 배포된 GAS 웹앱 URL (/exec)
const IMG = 'img/';
/* ================ */
let D = null, view = 'home', T = {};
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); };
const setting = (k,def) => (D && D.settings && D.settings[k]!==undefined && D.settings[k]!=='') ? D.settings[k] : def;
const pd = d => { const m=String(d||'').match(/(\d{4})-(\d{2})-(\d{2})/); return m? new Date(+m[1],+m[2]-1,+m[3]) : new Date(d); };
const daysSince = d => { if(!d) return 9e9; const x=pd(d); return Math.round((Date.now()-x)/86400000); };
const isNew = d => { const n=daysSince(d); return n>=-400 && n<=Number(setting('변경됨_표시_일수',45)); }; // 시행 예정 포함
const fmt = d => String(d||'').slice(0,10);
const hasGas = () => GAS_URL.startsWith('http');

async function loadData(){
  try{ const c=localStorage.getItem('lges_data'); if(c){ D=JSON.parse(c); } }catch(e){}
  if(!D) D = window.FALLBACK_DATA;
  render();
  if(!hasGas()) return;
  try{
    const r = await fetch(GAS_URL+'?action=data', {cache:'no-store'}); const j = await r.json();
    if(j && j.slides){ D=j; try{ localStorage.setItem('lges_data', JSON.stringify(j)); }catch(e){} if(view!=='train' || !T.started) render(); }
  }catch(e){ console.warn('data fetch fail', e); }
}

function go(v, arg){ view=v; T.arg=arg; render(); window.scrollTo(0,0); }

function render(){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on', b.dataset.v===view || (view==='result' && b.dataset.v==='train')));
  $('#backBtn').classList.toggle('hid', view==='home');
  const m=$('#main');
  if(view==='home') m.innerHTML=homeView();
  else if(view==='train') m.innerHTML=trainView();
  else if(view==='search'){ m.innerHTML=searchView(); const i=$('#q'); if(i){ i.value=T.q||''; i.oninput=()=>{T.q=i.value; renderResults();}; renderResults(); } }
  else if(view==='penalty') m.innerHTML=penaltyView();
  else if(view==='ops') m.innerHTML=opsView();
  else if(view==='detail') m.innerHTML=detailView();
  if(view==='train' && T.started && !T.finished) startTimer();
}

/* ===== 홈 ===== */
function homeView(){
  const os = D.onestrike.filter(r=>r['구분']==='One Strike Out');
  const changes = [...D.changes].sort((a,b)=>b['시행일']<a['시행일']?-1:1).slice(0,3);
  const sec = Number(setting('장당_초',30)); const n=D.slides.length;
  return `
  <div class="hero">
    <h2>고객사 현장 투입 전<br>안전교육을 받으세요</h2>
    <p>LG에너지솔루션 사업장 공사·셋업 작업자 필수. 이수 후 ${esc(setting('유효기간_개월',6))}개월간 유효합니다.</p>
    <button class="btn" onclick="go('train')">교육 시작하기</button>
    <div class="meta"><span>📑 ${n}장</span><span>⏱ 약 ${Math.ceil(n*sec/60)}분</span><span>✉️ 이수 확인 메일 발송</span></div>
  </div>
  <div class="quick">
    <button onclick="go('search','장비 셋업')"><span>🔧</span>셋업 작업수칙</button>
    <button onclick="go('search','LOTO')"><span>🔒</span>LOTO·전기</button>
    <button onclick="go('search','화기')"><span>🔥</span>화기작업</button>
    <button onclick="go('search','고소')"><span>🪜</span>고소작업</button>
    <button onclick="go('search','중장비')"><span>🏗️</span>중장비·지게차</button>
    <button onclick="go('penalty')"><span>⚠️</span>벌점표</button>
  </div>
  <div class="card">
    <h3><span class="ic">!</span>One Strike Out — 1회 적발 시 즉시 퇴출 <span class="pill red">26.10.1 시행</span></h3>
    <ol class="list">${os.map(r=>`<li>${esc(r['위반내역'])}</li>`).join('')}</ol>
    <p style="margin:10px 0 0;font-size:13.5px"><b>근로자</b> 영구 퇴출 · <b>협력사</b> 거래제한 1회 1개월 / 2회 3개월 / 3회 영구</p>
    <div class="src">${esc(os[0]?.['출처']||'')}</div>
  </div>
  <div class="card">
    <h3><span class="ic">7</span>7대 고위험 작업 — 전일 14~15시 사전신고</h3>
    <div class="row" style="align-items:flex-start">
      <div style="flex:1;font-size:14px">3m 이상 고소작업 · 아크/산소절단 · 3m 이상 화기작업 · 활성화 공정 · 전기실 작업 · 밀폐작업 · 고중량(15T↑ 지게차 / 20T↑ 크레인)<div style="margin-top:6px;font-size:13px;color:var(--mute)">카카오 사전신고방 참여코드 <b style="color:var(--ink)">2119</b></div></div>
      <img src="${IMG}s10_highrisk7.jpg" style="width:86px;border-radius:8px" alt="">
    </div>
    <div class="src">26년 8·9월 협의체</div>
  </div>
  <div class="card">
    <h3><span class="ic">☎</span>작업시간 · 비상연락</h3>
    <div class="kv">

const QKEY='lges_pending';
function getQueue(){ try{ return JSON.parse(localStorage.getItem(QKEY)||'[]'); }catch(e){ return []; } }
function setQueue(q){ try{ localStorage.setItem(QKEY, JSON.stringify(q)); }catch(e){} }
async function postRecord(rec){
  const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)});
  const j=await r.json(); if(!j.ok) throw new Error(j.error||'서버 오류'); return j;
}
async function flushQueue(){
  if(!hasGas()||!navigator.onLine) return; let q=getQueue(); if(!q.length) return;
  const rest=[]; let ok=0;
  for(const rec of q){ try{ await postRecord(rec); ok++; }catch(e){ rest.push(rec); } }
  setQueue(rest); if(ok) toast(`대기 중이던 교육 기록 ${ok}건을 전송했습니다`);
}
window.addEventListener('online', flushQueue); setInterval(flushQueue, 60000);
async function submitTrain(){
  const name=$('#fName').value.trim(), company=$('#fComp').value.trim(), phone=$('#fPhone').value.trim(), email=$('#fMail').value.trim();
  if(!name||!company||!phone||!email) return toast('모든 항목을 입력해 주세요');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('이메일 형식을 확인해 주세요');
  if(!$('#fAgree').checked) return toast('확인 체크가 필요합니다');
  if(!hasGas()){ toast('서버 미연결(테스트 모드) — 기록되지 않았습니다'); T.sent={name,company,email,expire:'(배포 후 표시)'}; render(); return; }
  const btn=$('#sendBtn'); btn.disabled=true; btn.textContent='전송 중…';
  const rec={name,company,phone,email,note:'slides:'+D.slides.length+' at:'+new Date().toISOString().slice(0,16)};
  let j=null, lastErr=null;
  for(let a=0;a<2&&!j;a++){ try{ j=await postRecord(rec); }catch(e){ lastErr=e; await new Promise(r=>setTimeout(r,1500)); } }
  if(j){ T.sent={name,company,email,expire:j.expire}; render(); window.scrollTo(0,0); return; }
  // 전송 실패 → 폰에 저장 후 자동 재전송
  const q=getQueue(); q.push(rec); setQueue(q);
  const exp=new Date(); exp.setMonth(exp.getMonth()+Number(setting('유효기간_개월',6)));
  T.sent={name,company,email,expire:exp.toISOString().slice(0,10),queued:true}; render(); window.scrollTo(0,0);
}

function norm(s){ return String(s||'').toLowerCase().replace(/\s+/g,''); }
function hit(q, ...fields){ if(!q) return true; const qs=norm(q).split(/[,\/]/).filter(Boolean); const hay=norm(fields.join(' ')); return qs.some(x=>hay.includes(x)); }
function renderResults(){
  const box=$('#res'); if(!box) return; const q=(T.q||'').trim(); const chip=T.chip||'전체'; let html='';
  const newBadge = d => isNew(d)?'<span class="pill red">변경됨</span>':'';

  if(chip!=='공통수칙'&&chip!=='벌점'){
    let O=(D.ops||[]);
    if(chip!=='전체') O=O.filter(o=>hit(chip,o['제목'],o['분류'],o['연관검색어'],o['내용']));
    O=O.filter(o=>hit(q,o['코드'],o['제목'],o['분류'],o['연관검색어'],o['내용']));
    const sc=o=>(hit(q,o['코드'],o['제목'])?100:0)+(hit(q,o['연관검색어'])?50:0)+(hit(q,o['분류'])?30:0)+(/^OPS/.test(o['코드'])?1:0);
    if(q) O.sort((a,b)=>sc(b)-sc(a));
    if(O.length&&(q||chip!=='전체')){ html+='<div class="sec">LG 규정 원문 (OPS) '+O.length+'</div><div class="ops">'+O.map(o=>opsCard(o,false)).join('')+'</div>'; }
  }
  // 작업별수칙
  let W=D.worktypes.filter(w=>(w['상태']||'유효')==='유효');
  if(chip!=='전체'&&chip!=='공통수칙'&&chip!=='벌점') W=W.filter(w=>w['작업유형'].startsWith(chip));
  if(chip!=='공통수칙'&&chip!=='벌점'){
    W=W.filter(w=>hit(q,w['작업유형'],w['수칙'],w['보호구'],w['사전절차'],w['키워드']));
    if(W.length){ html+='<div class="sec">작업별 안전수칙 '+W.length+'</div>';
      html+=W.map(w=>{ const codes=String(w['관련벌점코드']||'').split(',').map(x=>x.trim()).filter(Boolean).map(c=>D.penalty.find(p=>p['코드']===c)).filter(Boolean);
        return `<div class="card"><div class="tag"><span class="pill">${esc(w['작업유형'])}</span>${newBadge(w['적용시작일'])}</div><h4>${esc(w['수칙'])}</h4>
        ${w['보호구']?`<p class="sub">🦺 ${esc(w['보호구'])}</p>`:''}${w['사전절차']?`<p class="sub">📋 ${esc(w['사전절차'])}</p>`:''}
        ${codes.length?`<p class="sub">⚠️ 위반 시 ${codes.map(c=>`<b style="color:var(--red)">${esc(c['세부항목'].slice(0,22))}${c['세부항목'].length>22?'…':''} ${esc(c['감점'])}점${c['작업중지']?'+중지':''}</b>`).join(' · ')}</p>`:''}
        ${w['이미지']?`<img src="${IMG}${esc(w['이미지'])}" alt="" loading="lazy">`:''}<div class="src">${esc(w['출처'])}</div></div>`; }).join(''); }
  }
  // 공통수칙
  if(chip==='전체'||chip==='공통수칙'){
    const C=D.common.filter(c=>hit(q,c['구분'],c['항목'],c['내용']));
    if(C.length&&(q||chip==='공통수칙')){ html+='<div class="sec">사업장 공통수칙 '+C.length+'</div>'+C.map(c=>`<div class="card"><div class="tag"><span class="pill gray">${esc(c['구분'])}</span>${newBadge(c['적용시작일'])}</div><h4>${esc(c['항목'])}</h4><p>${esc(c['내용'])}</p><div class="src">${esc(c['출처'])}</div></div>`).join(''); }
  }
  // One Strike Out
  if(chip==='전체'||chip==='벌점'){
    const O=D.onestrike.filter(o=>hit(q,o['구분'],o['위반내역'],o['협력사페널티']));
    if(O.length&&(q||chip==='벌점')){ html+='<div class="sec">One Strike Out · 작업중지 · 사후조치 '+O.length+'</div>'+O.map(o=>`<div class="card"><div class="tag"><span class="pill red">${esc(o['구분'])}</span>${newBadge(o['적용시작일'])}</div><h4>${esc(o['위반내역'])}</h4>${o['협력사페널티']?`<p class="sub">🏢 ${esc(o['협력사페널티'])}</p>`:''}${o['근로자페널티']?`<p class="sub">👷 ${esc(o['근로자페널티'])}</p>`:''}${o['비고']?`<p class="sub">${esc(o['비고'])}</p>`:''}<div class="src">${esc(o['출처'])}</div></div>`).join(''); }
    const P=D.penalty.filter(p=>hit(q,p['대분류'],p['세부항목'],p['키워드'],p['코드']));
    if(P.length&&q){ html+='<div class="sec">벌점표 '+P.length+'</div>'+P.map(p=>penaltyCard(p)).join(''); }
  }
  if(!q&&chip==='전체'&&!html) html='';
  if(!html) html=`<div class="empty">검색 결과가 없습니다.<br><span style="font-size:13px">다른 단어로 검색하거나 상단 분류를 선택해 보세요.</span></div>`;
  box.innerHTML=html;
}
function penaltyCard(p){
  const up = p['변경']==='상향'||p['변경']==='신설';
  return `<div class="card"><div class="ptrow"><div><div class="tag"><span class="pill gray">${esc(p['코드'])} ${esc(p['대분류'])}</span>${p['작업중지']?'<span class="pill red">작업중지</span>':''}${up?`<span class="pill amber">${esc(p['변경'])}</span>`:''}</div><h4 style="margin:0">${esc(p['세부항목'])}</h4></div><div class="pt">${esc(p['감점'])}<small>점</small></div></div>
  ${up?`<p class="sub" style="margin-top:6px">26.7.1 개정 전 ${esc(p['구감점_25년9월'])}점 → <b>${esc(p['감점'])}점</b></p>`:''}<div class="src">${esc(p['출처'])}</div></div>`;
}


/* ===== 규정 원문 (OPS) ===== */
function opsCard(o, full){
  const kws=String(o['연관검색어']||'').split(',').map(x=>x.trim()).filter(Boolean);
  const items=String(o['내용']||'').split('|').map(x=>x.trim()).filter(Boolean);
  const show=full?items:items.slice(0,3);
  const li=show.map(x=>/^\[.+\]$/.test(x)?`<li class="h">${esc(x.replace(/^\[|\]$/g,''))}</li>`:`<li>${esc(x)}</li>`).join('');
  const imgs=String(o['원문이미지']||'').split(',').map(x=>x.trim()).filter(Boolean);
  const id='o'+String(o['코드']).replace(/[^\w]/g,'');
  return `<div class="card" id="${id}"><div class="tag"><span class="pill">${esc(o['코드'])}</span><span class="pill gray">${esc(o['분류'])}</span>${o['재개정일']?`<span style="font-size:11px;color:var(--mute)">${esc(o['재개정일'])} ${esc(o['개정번호']||'')}</span>`:''}${isNew(o['적용시작일'])?'<span class="pill red">변경됨</span>':''}</div>
  <h4 style="font-size:15.5px">${esc(o['제목'])}</h4>
  ${kws.length?`<div class="kwc">${kws.slice(0,8).map(k=>`<span>${esc(k)}</span>`).join('')}</div>`:''}
  <ul class="ob">${li}</ul>
  ${!full&&items.length>3?`<button class="more" onclick="go('ops','${esc(o['코드'])}')">전체 ${items.length}개 항목 보기 →</button>`:''}
  <div class="row" style="margin-top:10px">${imgs.length?`<button class="btn sm" onclick='openViewer(${JSON.stringify(imgs)},${JSON.stringify(String(o['코드'])+' '+String(o['제목']))})'>📄 LG 원문 보기 (${imgs.length}p)</button>`:''}</div>
  <div class="src">${esc(o['출처'])}</div></div>`;
}
function opsView(){
  const list=D.ops||[]; const focus=T.arg; T.arg=null;
  if(focus){ const o=list.find(x=>String(x['코드'])===String(focus)); if(o) return `<div class="ops">${opsCard(o,true)}<button class="btn ghost" onclick="go('ops')">규정 목록으로</button></div>`; }
  const groups={}; list.forEach(o=>{ const g=String(o['분류']||'').split('-')[0]||'기타'; (groups[g]=groups[g]||[]).push(o); });
  const order=['작업종류','공사설비','PPE','고위험작업','안전작업허가서','작업허가서','작업시간','면허제도','작업중지','비상','기타'];
  const keys=Object.keys(groups).sort((a,b)=>(order.indexOf(a)+99)%99-(order.indexOf(b)+99)%99);
  return `<div class="alert" style="background:var(--g3);border-color:var(--g)"><b>LG에너지솔루션 공사안전 OPS·규정 원문</b> — 협의체 자료에 공유된 ${list.length}건. 제목을 누르면 전체 내용, "원문 보기"를 누르면 LG 자료 페이지를 확대해서 볼 수 있습니다.</div>
  ${keys.map(k=>`<div class="sec">${esc(k)}</div><div class="card" style="padding:4px 14px">${groups[k].map(o=>`<div style="display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer" onclick="go('ops','${esc(o['코드'])}')"><span class="pill" style="flex:none">${esc(o['코드'])}</span><span style="flex:1;font-size:14px">${esc(o['제목'])}${isNew(o['적용시작일'])?' <span class="pill red">변경됨</span>':''}<div style="font-size:11.5px;color:var(--mute)">${esc(o['분류'])} · ${esc(o['재개정일']||'')}</div></span><span style="color:var(--mute)">›</span></div>`).join('')}</div>`).join('')}`;
}
function openViewer(imgs,title){
  const v=document.createElement('div'); v.className='viewer'; v.id='viewer';
  v.innerHTML=`<div class="vh"><b>${esc(title)}</b><button onclick="closeViewer()">닫기 ✕</button></div><div class="vb">${imgs.map(i=>`<img src="${IMG}ops/${esc(i)}" alt="">`).join('')}<div class="tip">두 손가락으로 확대해서 보세요 · 출처: LG에너지솔루션 공사업체 안전보건 협의회 자료</div></div>`;
  document.body.appendChild(v); document.body.style.overflow='hidden'; history.pushState({v:1},'');
}
function closeViewer(){ const v=$('#viewer'); if(v){ v.remove(); document.body.style.overflow=''; } }
window.addEventListener('popstate',()=>closeViewer());

/* ===== 벌점표 ===== */
function penaltyView(){
  const cats=[...new Set(D.penalty.map(p=>p['대분류']))]; if(!T.pcat) T.pcat=cats[0];
  const rows=D.penalty.filter(p=>p['대분류']===T.pcat);
  const lv=D.onestrike.filter(o=>/^작업중지 Level|^누적/.test(o['구분']));
  return `<div class="alert"><b>26년 7월 1일 감점기준 전면 개정</b> — 위험성평가 미실시·추락방지·LOTO·인터락 해제·밀폐 환기 등 주요 항목이 <b>20점 + 작업중지</b>로 상향됐습니다. 누적 20점부터 사후조치, 70점 이상 입찰제한~거래중지.</div>
  <div class="chips">${cats.map(c=>`<button class="${T.pcat===c?'on':''}" onclick="T.pcat='${esc(c)}';render()">${esc(c)}</button>`).join('')}</div>
  <div class="card" style="padding:6px 10px"><table><thead><tr><th style="width:52px">코드</th><th>세부항목</th><th style="text-align:right">감점</th></tr></thead><tbody>
  ${rows.map(p=>`<tr><td style="color:var(--mute);font-size:12px">${esc(p['코드'])}</td><td>${esc(p['세부항목'])}${p['작업중지']?' <span class="pill red" style="font-size:10px">중지</span>':''}${(p['변경']==='상향')?` <span class="pill amber" style="font-size:10px">${esc(p['구감점_25년9월'])}→</span>`:''}</td><td class="n" style="color:${Number(String(p['감점']).split('/')[0])>=10?'var(--red)':'var(--ink)'}">${esc(p['감점'])}</td></tr>`).join('')}
  </tbody></table><div class="src">${esc(rows[0]?.['출처']||'')}</div></div>
  <div class="sec">작업중지 Level · 누적 점수 사후조치</div>
  ${lv.map(o=>`<div class="card" style="padding:12px 14px"><div class="tag"><span class="pill ${/Level 3|70점|50점/.test(o['구분'])?'red':/Level 2|30점/.test(o['구분'])?'amber':''}">${esc(o['구분'])}</span></div><h4 style="margin:4px 0">${esc(o['위반내역'])}</h4><p class="sub">${esc(o['협력사페널티'])}</p>${o['비고']?`<p class="sub">${esc(o['비고'])}</p>`:''}</div>`).join('')}
  <p class="foot">우수사례는 건별 가산점 3점 · 반기 적격수급업체 평가에 반영</p>`;
}

/* ===== 상세(변경이력/강조사항) ===== */
function detailView(){
  const ch=[...D.changes].sort((a,b)=>b['시행일']<a['시행일']?-1:1);
  const hl=[...D.highlights].sort((a,b)=>b['월']<a['월']?-1:1);
  return `<div class="sec">규정 변경 이력</div><div class="card" style="padding:8px 16px">${ch.map(c=>`<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px"><span style="flex:none;color:var(--mute);font-size:12.5px;width:84px;padding-top:2px">${esc(c['시행일'])}</span><span>${esc(c['내용'])} ${isNew(c['시행일'])?'<span class="pill red">변경됨</span>':''}<div style="font-size:11.5px;color:var(--mute)">${esc(c['출처'])}</div></span></div>`).join('')}</div>
  <div class="sec">월별 협의체 강조사항</div>${hl.map(h=>`<div class="card" style="padding:12px 14px"><div class="tag"><span class="pill gray">${esc(h['월'])}</span></div><h4 style="margin:4px 0 6px;font-size:14.5px">${esc(h['제목'])}</h4><p style="margin:0;font-size:13.5px">${esc(h['내용'])}</p><div class="src">${esc(h['출처'])}</div></div>`).join('')}`;
}
loadData(); setTimeout(flushQueue, 2000);
</script>
